<div class="container-fullscreen">
  <div class="card p-4">
    <h5 class="text-center mb-4 text-primary">
      <i class="bi bi-gear"></i> Settings
    </h5>

    <form [formGroup]="settingsForm" (ngSubmit)="saveSettings()">

      <!-- Phone -->
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input formControlName="phoneNumber" class="form-control" />
      </div>

      <!-- App source toggle -->
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" formControlName="useCustomApps" />
        <label class="form-check-label">
          Use Custom Apps
        </label>
      </div>

      <!-- App selector -->
      <div class="mb-3">
        <label class="form-label">
          Select {{ isCustomApps ? 'Custom' : 'Demo' }} App
        </label>

        <div class="input-group">
          <select class="form-select" formControlName="selectedApp">
            <option *ngFor="let app of apps" [value]="app.app_code">
              {{ app.name }}
            </option>
          </select>

          <!-- Reload demo apps -->
          <button *ngIf="!isCustomApps" type="button" class="btn btn-outline-secondary" (click)="reloadDemoApps()"
            title="Reload demo apps">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary w-100 mb-2">
        <i class="bi bi-save"></i> Save Settings
      </button>

      <button type="button" class="btn btn-danger w-100" (click)="resetAll()">
        <i class="bi bi-trash"></i> Reset
      </button>
    </form>
  </div>
</div>
