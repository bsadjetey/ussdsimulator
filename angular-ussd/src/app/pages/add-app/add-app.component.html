<div class="container-fullscreen">
  <div class="card p-4">
    <h5 class="text-center mb-4 text-primary">
      <i class="bi bi-plus-circle"></i> Add Custom USSD App
    </h5>

    <form [formGroup]="addAppForm" (ngSubmit)="addApp()">
      <div class="mb-3">
        <label class="form-label">App Name</label>
        <input formControlName="appName" class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">App Code</label>
        <input formControlName="appCode" class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">App URL</label>
        <input formControlName="appUrl" type="url" class="form-control" />
      </div>

      <button class="btn btn-primary w-100">
        <i class="bi bi-save"></i> Save Custom App
      </button>
    </form>
  </div>
</div>
