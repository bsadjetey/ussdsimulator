<div class="container-fullscreen">
  <div class="card p-4">
    <h5 class="text-center mb-4 text-primary">
      <i class="bi bi-gear"></i> Settings
    </h5>

    <form [formGroup]="settingsForm" (ngSubmit)="saveSettings()">

      <!-- Phone -->
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input formControlName="phoneNumber" class="form-control" [class.is-invalid]="
            settingsForm.get('phoneNumber')?.touched &&
            settingsForm.get('phoneNumber')?.invalid
          " />

        <div class="invalid-feedback">Phone number is required</div>
      </div>

      <!-- App source toggle -->
      <!-- <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" formControlName="useCustomApps" />
        <label class="form-check-label">
          Use Custom Apps
        </label>
      </div> -->

      <!-- App selector -->
      <div class="mb-3">
        <label class="form-label">
          Select {{ isCustomApps ? 'Custom' : 'Demo' }} App
        </label>

        <div class="input-group">
          <select class="form-select" formControlName="selectedApp" [class.is-invalid]="
              settingsForm.get('selectedApp')?.touched &&
              settingsForm.get('selectedApp')?.invalid
            ">
            <option value="" disabled>Select an app</option>
            <option *ngFor="let app of apps" [value]="app.app_code">
              {{ app.name }}
            </option>
          </select>

          <!-- Reload demo apps -->
          <button type="button" class="btn btn-outline-secondary" (click)="reloadDemoApps()" title="Reload demo apps">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>

        <div class="invalid-feedback d-block" *ngIf="
            settingsForm.get('selectedApp')?.touched &&
            settingsForm.get('selectedApp')?.invalid
          ">
          Please select a demo app
        </div>
      </div>

      <button class="btn btn-primary w-100 mb-2" type="submit" [disabled]="settingsForm.invalid">
        <i class="bi bi-save"></i> Save Settings
      </button>

      <button type="button" class="btn btn-danger w-100" (click)="resetAll()">
        <i class="bi bi-trash"></i> Reset
      </button>
    </form>
  </div>
</div>
